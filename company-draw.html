<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公司幸運輪盤抽籤系統 - Meiloon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            margin: 0; 
            min-height: 100vh;
            overflow-x: hidden; 
            background: #A7C7E7; 
            font-family: 'Microsoft JhengHei', sans-serif; 
        }
        
        .wheel-container {
            position: relative;
            width: 90vw;
            max-width: 480px;
            aspect-ratio: 1/1;
            margin: 0 auto;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,0,0,0.35);
            border: 8px solid #333;
            transition: transform 0.1s;
        }

        /* Pointer */
        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 50px;
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .pointer::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 50px solid #ef4444; /* Red Pointer */
        }

        button {
            font-weight: bold;
            transition: all 0.15s;
        }
        button:active { transform: scale(0.96); }

        #action-btn {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            font-size: 30px;
            background: linear-gradient(135deg, #22c55e, #15803d);
            border: 6px solid #14532d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 25;
            cursor: pointer;
            user-select: none;
        }
        #action-btn.stop-mode {
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border-color: #7f1d1d;
        }
        #action-btn:disabled {
            background: #555;
            border-color: #333;
            cursor: not-allowed;
        }
        
        .confetti {
            position: absolute;
            width: 10px; height: 10px;
            animation: fall linear forwards;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(59, 130, 246, 0.7); }
    </style>
</head>
<body class="p-3 md:p-6">

    <!-- Top Navigation Bar: Return to Lobby -->
    <div class="fixed top-3 left-3 z-30 flex gap-2">
        <a href="index.html" title="返回大廳" class="bg-white/80 hover:bg-white text-blue-900 w-11 h-11 flex items-center justify-center rounded-full transition shadow-lg backdrop-blur-sm border border-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">

        <h2 id="modal-title" class="text-gray-300 text-xl md:text-2xl font-bold mb-3">恭喜當選！</h2>
        
        <!-- Role/Prize Badge (In role mode) -->
        <div id="modal-role-badge" class="hidden text-xl md:text-2xl font-black text-yellow-300 bg-yellow-500/20 border border-yellow-400/50 px-6 py-2 rounded-full mb-4 shadow-lg shadow-yellow-500/20">

        <!-- Winner Name or Number -->

        <button onclick="closeModal()" class="bg-yellow-400 hover:bg-yellow-300 text-gray-900 px-10 py-3 rounded-full font-black text-lg shadow-xl hover:shadow-yellow-400/50 transition active:scale-95">
            確定 (Space)
        </button>
    </div>

    <!-- Toast Notification for Copy -->
    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white text-xs md:text-sm font-bold px-4 py-2 rounded-full shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none z-[120]">
        已複製到剪貼簿！
    </div>

    <script>
        /* ==========================================================
           全域變數與元素參考 (Global Variables & Elements)
           ========================================================== */
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const countInput = document.getElementById('memberCount');
        const drawInput = document.getElementById('drawCount');
        const btn = document.getElementById('action-btn');
        const statusText = document.getElementById('status-text');
        const winnersContainer = document.getElementById('winners-container');
        
        // Mode & Custom Elements
        const panelCustom = document.getElementById('panel-custom');
        const panelNumber = document.getElementById('panel-number');
        const tabCustom = document.getElementById('tab-custom');
        const tabNumber = document.getElementById('tab-number');
        const customTitleInput = document.getElementById('customTitleInput');
        const rolesInput = document.getElementById('rolesInput');
        const candidatesInput = document.getElementById('candidatesInput');
        const autoRemoveCheckbox = document.getElementById('autoRemoveCheckbox');
        const targetBanner = document.getElementById('current-target-banner');
        const targetRoleNameEl = document.getElementById('target-role-name');
        const targetProgressEl = document.getElementById('target-progress');

        // Current Mode: 'custom' (職位/自訂名單) or 'number' (原版數字序號)
        let currentMode = 'custom';

        // Wheel State
        let segments = [];
        let totalMembers = 14;
        let winners = []; // Array of { role: string, name: string } or string (number mode)
        let remainingDraws = 3;
        let currentAngle = 0; // Degrees
        let isSpinning = false;
        let isStopping = false;
        let speed = 0;
        let animationFrameId;
        let friction = 0.985;

        // Custom Mode Specific State
        let customRoles = [];
        let currentRoleIndex = 0;
        let originalCandidates = [];

        /* ==========================================================
           音效邏輯 (Web Audio API)
           ========================================================== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let lastAngle = 0;

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'tick') {
                // Short high pitch tick
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'win') {
                // Victory chord
                const now = audioCtx.currentTime;
                
                // Note 1
                const osc1 = audioCtx.createOscillator();
                const g1 = audioCtx.createGain();
                osc1.connect(g1); g1.connect(audioCtx.destination);
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                g1.gain.setValueAtTime(0.2, now);
                g1.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
                osc1.start(); osc1.stop(now + 1.5);

                // Note 2
                const osc2 = audioCtx.createOscillator();
                const g2 = audioCtx.createGain();
                osc2.connect(g2); g2.connect(audioCtx.destination);
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, now + 0.1); // E5
                g2.gain.setValueAtTime(0.2, now + 0.1);
                g2.gain.exponentialRampToValueAtTime(0.001, now + 1.6);
                osc2.start(now + 0.1); osc2.stop(now + 1.6);
                
                // Note 3
                const osc3 = audioCtx.createOscillator();
                const g3 = audioCtx.createGain();
                osc3.connect(g3); g3.connect(audioCtx.destination);
                osc3.type = 'square';
                osc3.frequency.setValueAtTime(783.99, now + 0.2); // G5
                g3.gain.setValueAtTime(0.1, now + 0.2);
                g3.gain.exponentialRampToValueAtTime(0.001, now + 2);
                osc3.start(now + 0.2); osc3.stop(now + 2);
            }
        }

        /* ==========================================================
           調色盤 (Palette)
           ========================================================== */
        const colors = [
            '#ef4444', '#f97316', '#f59e0b', '#84cc16', 
            '#10b981', '#06b6d4', '#3b82f6', '#6366f1', 
            '#8b5cf6', '#d946ef', '#f43f5e', '#64748b'
        ];

        /* ==========================================================
           模式切換與範本載入 (Mode Switch & Preset Templates)
           ========================================================== */
        function switchMode(mode) {
            currentMode = mode;
            if (mode === 'custom') {
                tabCustom.className = "flex-1 py-2 text-xs md:text-sm font-black rounded-xl transition bg-white text-blue-900 shadow";
                tabNumber.className = "flex-1 py-2 text-xs md:text-sm font-black rounded-xl transition text-blue-700 hover:text-blue-900";
                panelCustom.classList.remove('hidden');
                panelNumber.classList.add('hidden');
                applyCustomSettings();
            } else {
                tabNumber.className = "flex-1 py-2 text-xs md:text-sm font-black rounded-xl transition bg-white text-blue-900 shadow";
                tabCustom.className = "flex-1 py-2 text-xs md:text-sm font-black rounded-xl transition text-blue-700 hover:text-blue-900";
                panelNumber.classList.remove('hidden');
                panelCustom.classList.add('hidden');
                initWheel();
            }
        }

        const PRESETS = {
            fuwei: {
                title: "2026 福委幹部選拔抽籤",
                roles: [
                    "總幹事",
                    "會計",
					"出納",
					"團險",
					"康樂",
					"文書",
					"團購"
                ],
                candidates: [
                    "李筱嬋",
                    "吳思佩",
                    "廖啟之",
                    "趙若石",
                    "魯正修",
                    "王庭裕",
                    "張靜茹"
                ]
            },
            prizes: {
                title: "幸運大抽獎",
                roles: [
                    "特獎 (iPhone 16)",
                    "頭獎 (Dyson 吹風機)",
                    "貳獎 (百貨禮券 3,000元)",
                    "參獎 (藍牙喇叭)",
                    "肆獎 (電影票 2張)",
                    "伍獎 (連鎖咖啡禮券)"
                ],
                candidates: [
                    "王小明", "陳大同", "李美惠", "林志豪", "張志強",
                    "吳淑芬", "黃俊賢", "劉美玲", "蔡文雄", "楊雅惠"
                ]
            }
        };

        function loadPreset(key) {
            if (key === 'clear') {
                rolesInput.value = "";
                candidatesInput.value = "";
                onRolesChanged();
                onCandidatesChanged();
                return;
            }

            const data = PRESETS[key];
            if (!data) return;

            customTitleInput.value = data.title;
            updatePageTitle(data.title);
            rolesInput.value = data.roles.join("\n");
            candidatesInput.value = data.candidates.join("\n");
            onRolesChanged();
            onCandidatesChanged();
            applyCustomSettings();
        }

        function updatePageTitle(title) {
            const pageTitle = document.getElementById('page-title');
            if (pageTitle) pageTitle.innerText = title || "幸運輪盤抽籤系統";
        }

        function onRolesChanged() {
            const text = rolesInput.value.trim();
            const lines = text ? text.split('\n').map(s => s.trim()).filter(s => s.length > 0) : [];
            const badge = document.getElementById('roles-count-badge');
            if (badge) {
                badge.innerText = lines.length > 0 ? `共 ${lines.length} 項` : '純名單抽籤';
            }
        }

        function onCandidatesChanged() {
            const text = candidatesInput.value.trim();
            const names = parseCandidates(text);
            const badge = document.getElementById('candidates-count-badge');
            if (badge) {
                badge.innerText = `目前 ${names.length} 人`;
            }
        }

        function parseCandidates(raw) {
            if (!raw) return [];
            return raw
                .split(/[\n,，]+/)
                .map(s => s.trim())
                .filter(s => s.length > 0);
        }

        /* ==========================================================
           自訂模式初始化 (Apply Custom Settings)
           ========================================================== */
        function applyCustomSettings() {
            const candidateNames = parseCandidates(candidatesInput.value);
            if (candidateNames.length < 2) {
                alert("請至少在名單中填入 2 位同仁姓名！");
                return;
            }

            // Parse roles
            const rawRoles = rolesInput.value.trim();
            customRoles = rawRoles ? rawRoles.split('\n').map(s => s.trim()).filter(s => s.length > 0) : [];
            
            currentRoleIndex = 0;
            winners = [];
            originalCandidates = [...candidateNames];

            // Set draws count
            if (customRoles.length > 0) {
                remainingDraws = customRoles.length;
            } else {
                remainingDraws = candidateNames.length;
            }

            // Generate initial segments from candidate names
            segments = [];
            candidateNames.forEach((name, i) => {
                segments.push({
                    text: name,
                    color: colors[i % colors.length]
                });
            });

            updatePageTitle(customTitleInput.value);
            updateUI();
            drawWheel();
            
            if (customRoles.length > 0) {
                statusText.innerText = `準備抽取第 1 項：【${customRoles[0]}】`;
            } else {
                statusText.innerText = `候選同仁共 ${segments.length} 人，準備開始！`;
            }
        }

        /* ==========================================================
           原版數字模式初始化 (Original Wheel Init)
           ========================================================== */
        function initWheel() {
            const val = parseInt(countInput.value);
            if(val < 2 || val > 100) return alert("請輸入 2 到 100 之間的人數");
            
            totalMembers = val;
            remainingDraws = parseInt(drawInput.value) || 3;
            winners = [];
            customRoles = [];
            currentRoleIndex = 0;
            
            // Generate Initial Segments with numbers
            segments = [];
            for(let i=1; i<=totalMembers; i++) {
                segments.push({
                    text: i.toString(),
                    color: colors[(i-1) % colors.length]
                });
            }
            
            updateUI();
            drawWheel();
            statusText.innerText = `已重置：${totalMembers}人, 抽${remainingDraws}位`;
        }

        function resetGame() {
            if(confirm("確定要重置抽籤嗎？所有當前中獎與名單紀錄將被清空。")) {
                if (currentMode === 'custom') {
                    applyCustomSettings();
                } else {
                    initWheel();
                }
            }
        }

        function updateDrawSettings() {
            const val = parseInt(drawInput.value);
            if(val > 0) remainingDraws = val;
            updateUI();
        }

        /* ==========================================================
           UI 畫面更新 (Update UI)
           ========================================================== */
        function updateUI() {
            // Update Target Banner
            if (currentMode === 'custom' && customRoles.length > 0 && currentRoleIndex < customRoles.length) {
                targetBanner.classList.remove('hidden');
                targetRoleNameEl.innerText = `【${customRoles[currentRoleIndex]}】`;
                targetProgressEl.innerText = `第 ${currentRoleIndex + 1} / ${customRoles.length} 位`;
            } else if (currentMode === 'custom' && customRoles.length > 0) {
                targetBanner.classList.remove('hidden');
                targetRoleNameEl.innerText = "【已全數抽出】";
                targetProgressEl.innerText = `共 ${customRoles.length} 位`;
            } else {
                targetBanner.classList.add('hidden');
            }

            // Update Winners List
            if (winners.length === 0) {
                winnersContainer.innerHTML = '<p class="text-gray-400 text-xs text-center py-2 font-medium">尚無抽籤紀錄</p>';
            } else {
                if (currentMode === 'custom' && customRoles.length > 0) {
                    winnersContainer.innerHTML = winners.map((w, idx) => `
                        <div class="flex items-center justify-between w-full bg-blue-50/90 border border-blue-200/80 px-3 py-1.5 rounded-xl shadow-sm text-xs">
                            <span class="font-bold text-blue-900 bg-blue-200/80 px-2 py-0.5 rounded-md">
                                ${w.role || `第 ${idx+1} 位`}
                            </span>
                            <span class="font-black text-blue-950 text-sm">
                                ${w.name || w}
                            </span>
                        </div>
                    `).join('');
                } else {
                    winnersContainer.innerHTML = `
                        <div class="flex flex-wrap justify-center gap-1.5">
                            ${winners.map(w => `
                                <span class="bg-yellow-400 border border-yellow-500 text-blue-950 font-black px-2.5 py-1 rounded-lg shadow-sm text-xs md:text-sm">
                                    ${typeof w === 'object' ? w.name : w}
                                </span>
                            `).join('')}
                        </div>
                    `;
                }
            }

            // Update Input
            if (drawInput) drawInput.value = remainingDraws;

            // Update Button State
            if(remainingDraws <= 0 || segments.length === 0) {
                btn.disabled = true;
                btn.innerText = "END";
                btn.style.background = "#555";
                btn.style.borderColor = "#333";
                statusText.innerText = "抽籤全部完成！🎉";
            } else {
                btn.disabled = false;
                btn.innerText = "GO!";
                btn.classList.remove("stop-mode");
                btn.style.background = ""; // Reset inline style
                btn.style.borderColor = "";
            }
        }

        /* ==========================================================
           繪製輪盤 (Draw Wheel Canvas)
           ========================================================== */
        function drawWheel() {
            if(segments.length === 0) {
                 ctx.clearRect(0, 0, canvas.width, canvas.height);
                 return;
            }

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2 - 20; // Padding
            const sliceAngle = (2 * Math.PI) / segments.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Save context for rotation
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate((currentAngle * Math.PI) / 180);

            segments.forEach((seg, i) => {
                const startAngle = i * sliceAngle - (Math.PI / 2); // Start from top (-90deg)
                const endAngle = startAngle + sliceAngle;

                // Draw Slice
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.arc(0, 0, radius, startAngle, endAngle);
                ctx.fillStyle = seg.color;
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 3;
                ctx.stroke();

                // Draw Text (Support Chinese Names & Number)
                ctx.save();
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = "#ffffff";

                // Dynamic Font Size based on segment count & text length
                const textLen = (seg.text || "").length;
                let fontSize = 34;
                if (segments.length > 8) fontSize = 28;
                if (segments.length > 14) fontSize = 22;
                if (segments.length > 24) fontSize = 17;
                if (segments.length > 40) fontSize = 13;
                if (textLen > 4 && fontSize > 18) fontSize = 18;

                ctx.font = `bold ${fontSize}px 'Microsoft JhengHei', Arial, sans-serif`;
                
                // Add soft text shadow for crisp contrast
                ctx.shadowColor = "rgba(0,0,0,0.6)";
                ctx.shadowBlur = 4;
                ctx.fillText(seg.text, radius - 30, 0);
                ctx.restore();
            });

            // Center Circle
            ctx.beginPath();
            ctx.arc(0, 0, 75, 0, 2 * Math.PI);
            ctx.fillStyle = "#ffffff";
            ctx.fill();
            ctx.strokeStyle = "#333333";
            ctx.lineWidth = 6;
            ctx.stroke();

            ctx.restore();
        }

        /* ==========================================================
           旋轉與停止控制 (Spin & Stop Logic)
           ========================================================== */
        function toggleSpin() {
            if(segments.length === 0 || remainingDraws <= 0) return;

            if (!isSpinning) {
                // START SPINNING
                if (audioCtx.state === 'suspended') audioCtx.resume();
                isSpinning = true;
                isStopping = false;
                btn.innerText = "STOP";
                btn.classList.add("stop-mode");
                statusText.innerText = "旋轉加速中...";
                
                // Acceleration Logic
                let accel = 0;
                const targetSpeed = 26 + Math.random() * 8; // Random max speed

                const spinLoop = () => {
                    if(!isSpinning) return;

                    if (!isStopping) {
                        // Phase 1: Accelerate to max speed
                        if (speed < targetSpeed) {
                            speed += 0.6;
                        } else {
                            statusText.innerText = "旋轉中... 請按 STOP 停止";
                        }
                    } else {
                        // Phase 2: Decelerate (Stop clicked)
                        speed *= friction; 
                        
                        if (speed < 0.05) {
                            finalize();
                            return; 
                        }
                    }

                    // Audio Tick Logic
                    if(segments.length > 0) {
                        const sliceDeg = 360 / segments.length;
                        const prevSlice = Math.floor(currentAngle / sliceDeg);
                        
                        currentAngle += speed;
                        if (currentAngle >= 360) currentAngle %= 360;
                        
                        const newSlice = Math.floor(currentAngle / sliceDeg);
                        if (prevSlice !== newSlice) {
                            playSound('tick');
                        }
                    }

                    drawWheel();
                    animationFrameId = requestAnimationFrame(spinLoop);
                };
                spinLoop();

            } else {
                // STOP COMMAND
                if(isStopping) return; // Already stopping
                
                isStopping = true;
                btn.innerText = "WAIT...";
                btn.disabled = true;
                statusText.innerText = "減速對位中...";

                // 隨機摩擦邏輯
                const randomFactor = (performance.now() % 100) / 10000;
                friction = 0.980 + Math.random() * 0.005 + randomFactor; 
            }
        }

        /* ==========================================================
           開獎結算 (Finalize & Result Calculation)
           ========================================================== */
        function finalize() {
            isSpinning = false;
            cancelAnimationFrame(animationFrameId);
            statusText.innerText = "結果出爐！";
            playSound('win');

            // Calculate Winner index
            const finalAngle = currentAngle % 360;
            const sliceDegrees = 360 / segments.length;
            let index = Math.floor((360 - finalAngle) / sliceDegrees) % segments.length;
            const winnerSeg = segments[index];

            // Determine Role Name (if in role mode)
            let assignedRole = "";
            if (currentMode === 'custom' && customRoles.length > 0) {
                assignedRole = customRoles[currentRoleIndex] || `第 ${winners.length + 1} 順位`;
                winners.push({ role: assignedRole, name: winnerSeg.text });
                currentRoleIndex++;
            } else {
                winners.push({ role: "", name: winnerSeg.text });
            }

            remainingDraws--;

            // Auto Remove check: 抽到後自動刪除
            const shouldRemove = (currentMode === 'custom') ? autoRemoveCheckbox.checked : true;
            if (shouldRemove) {
                segments.splice(index, 1);
            }

            // Show Result Modal
            showResult(winnerSeg.text, assignedRole);
            
            updateUI();
            drawWheel();
        }

        /* ==========================================================
           結果彈窗展示 (Show Result Modal)
           ========================================================== */
        function showResult(text, role) {
            const modal = document.getElementById('result-modal');
            const numEl = document.getElementById('winner-num');
            const titleEl = document.getElementById('modal-title');
            const roleBadge = document.getElementById('modal-role-badge');
            const nextHintEl = document.getElementById('modal-next-hint');

            modal.classList.remove('hidden');
            numEl.innerText = text;

            if (role) {
                titleEl.innerText = "🎉 恭喜當選！";
                roleBadge.classList.remove('hidden');
                roleBadge.innerText = `當選職位：${role}`;
                
                if (currentRoleIndex < customRoles.length) {
                    nextHintEl.classList.remove('hidden');
                    nextHintEl.innerText = `👉 下一位即將抽取：【${customRoles[currentRoleIndex]}】`;
                } else {
                    nextHintEl.classList.remove('hidden');
                    nextHintEl.innerText = "🏆 本次職位已全數抽取完成！";
                }
            } else {
                titleEl.innerText = "幸運得主是";
                roleBadge.classList.add('hidden');
                nextHintEl.classList.add('hidden');
            }

            setTimeout(() => {
                numEl.classList.remove('scale-0');
                numEl.classList.add('scale-100');
                createConfetti();
            }, 100);
        }

        function closeModal() {
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('winner-num').classList.add('scale-0');
            document.getElementById('winner-num').classList.remove('scale-100');
            
            // If draws remain, update status
            if(remainingDraws > 0 && segments.length > 0) {
                if (currentMode === 'custom' && customRoles.length > 0 && currentRoleIndex < customRoles.length) {
                    statusText.innerText = `準備抽取第 ${currentRoleIndex + 1} 位：【${customRoles[currentRoleIndex]}】`;
                } else {
                    statusText.innerText = `準備下一位 (剩餘 ${remainingDraws} 位)`;
                }
            } else {
                statusText.innerText = "抽籤全部完成！🎉";
            }
        }

        /* ==========================================================
           鍵盤快捷鍵 (Keyboard Space Listener)
           ========================================================== */
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                // If typing in input or textarea, do NOT trigger spin
                if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;

                e.preventDefault();

                // If modal is open, close it first
                const modal = document.getElementById('result-modal');
                if (!modal.classList.contains('hidden')) {
                    closeModal();
                    return;
                }

                // Trigger spin / stop
                toggleSpin();
            }
        });

        /* ==========================================================
           彩帶特效 (Confetti Effect)
           ========================================================== */
        function createConfetti() {
            const modal = document.getElementById('result-modal');
            for(let i=0; i<60; i++) {
                const conf = document.createElement('div');
                conf.className = 'confetti';
                conf.style.left = Math.random() * 100 + 'vw';
                conf.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                conf.style.animationDuration = (Math.random() * 2.5 + 1.8) + 's';
                modal.appendChild(conf);
                setTimeout(() => conf.remove(), 4500);
            }
        }

        /* ==========================================================
           一鍵複製名單 (Copy Winners to Clipboard)
           ========================================================== */
        function copyWinners() {
            if (winners.length === 0) {
                showToast("目前尚無抽籤名單可複製！");
                return;
            }

            const title = customTitleInput.value || "幸運輪盤抽籤結果";
            let text = `【${title}】\n--------------------\n`;

            winners.forEach((w, i) => {
                if (typeof w === 'object') {
                    if (w.role) {
                        text += `${i + 1}. ${w.role}：${w.name}\n`;
                    } else {
                        text += `${i + 1}. ${w.name}\n`;
                    }
                } else {
                    text += `${i + 1}. ${w} 號\n`;
                }
            });
            text += `--------------------\n抽籤時間：${new Date().toLocaleString('zh-TW', { hour12: false })}`;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("名單已成功複製到剪貼簿！📋");
                }).catch(() => {
                    fallbackCopy(text);
                });
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.left = "-9999px";
            document.body.appendChild(ta);
            ta.select();
            document.execCommand("copy");
            document.body.removeChild(ta);
            showToast("名單已成功複製到剪貼簿！📋");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }

        /* ==========================================================
           頁面預設啟動 (Init Default)
           ========================================================== */
        // 預設載入福委會 6 職位範本，方便直接上手
        loadPreset('fuwei');

    </script>
</body>
